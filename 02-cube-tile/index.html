<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>AGM Cube Tile</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fef9f3;
      color: #111;
      font-family:
        "SFMono-Regular",
        "SF Mono",
        Menlo,
        Consolas,
        monospace;
    }

    body {
      display: flex;
      gap: 20px;
      padding: 20px;
    }

    #controls {
      width: 260px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }

    .group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 11px;
    }

    .value {
      opacity: 0.5;
    }

    select,
    input[type="range"] {
      width: 100%;
    }

    label {
      font-size: 11px;
    }

    .note {
      font-size: 10px;
      line-height: 1.4;
      opacity: 0.55;
      margin: 0;
    }

    .hidden {
      display: none !important;
    }

    button {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #111;
      background: transparent;
      color: #111;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
    }

    button:hover {
      background: #111;
      color: #fff;
    }

    #canvas-wrap {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fef9f3;
    }

    #canvas-container {
      width: 100%;
      max-height: 100%;
      aspect-ratio: 16 / 9;
      background: #fef9f3;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>

<body>
  <aside id="controls">
    <div class="group">
      <label for="packMode">Mode</label>

      <select id="packMode">
        <option value="fixed" selected>
          Fixed size
        </option>
        <option value="variable">
          Variable size
        </option>
      </select>

      <p class="note">
        Tiles scatter with random rotation.
        Collision uses a tighter inset around
        each hex so logos can nest closer.
      </p>
    </div>

    <div class="group" id="fixedControls">
      <div class="row">
        <label for="fixedScale">Tile width</label>
        <span id="fixedScaleValue" class="value"></span>
      </div>

      <input
        id="fixedScale"
        type="range"
        min="8"
        max="28"
        step="1"
        value="14"
      />
    </div>

    <div class="group hidden" id="variableControls">
      <div class="row">
        <label for="minScale">Min width</label>
        <span id="minScaleValue" class="value"></span>
      </div>

      <input
        id="minScale"
        type="range"
        min="7"
        max="22"
        step="1"
        value="9"
      />

      <div class="row">
        <label for="maxScale">Max width</label>
        <span id="maxScaleValue" class="value"></span>
      </div>

      <input
        id="maxScale"
        type="range"
        min="10"
        max="28"
        step="1"
        value="18"
      />
    </div>

    <div class="group">
      <div class="row">
        <label for="tileGap">Tile gap</label>
        <span id="tileGapValue" class="value"></span>
      </div>

      <input
        id="tileGap"
        type="range"
        min="0"
        max="12"
        step="1"
        value="0"
      />
    </div>

    <div class="group">
      <div class="row">
        <span>Tiles placed</span>
        <span id="tileCountValue" class="value">0</span>
      </div>

      <div class="row">
        <span>Coverage</span>
        <span id="coverageValue" class="value">0%</span>
      </div>
    </div>

    <button id="regenerateButton" type="button">
      Regenerate pack
    </button>
  </aside>

  <div id="canvas-wrap">
    <div id="canvas-container"></div>
  </div>

  <script src="sketch.js"></script>
</body>
</html>
