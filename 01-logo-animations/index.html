<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Logo Animations</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fef9f3;
      color: #111;
      font-family:
        "SFMono-Regular",
        "SF Mono",
        Menlo,
        Consolas,
        monospace;
    }

    body {
      display: flex;
      gap: 20px;
      padding: 20px;
    }

    #controls {
      width: 260px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }

    .group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 11px;
    }

    .value {
      opacity: 0.5;
    }

    input[type="file"],
    input[type="range"],
    input[type="color"] {
      width: 100%;
    }

    input[type="color"] {
      height: 36px;
      padding: 0;
      border: 1px solid #111;
      background: transparent;
    }

    label {
      font-size: 11px;
    }

    select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #111;
      background: transparent;
      color: #111;
      font: inherit;
      font-size: 11px;
    }

    .mode-panel {
      display: none;
      flex-direction: column;
      gap: 18px;
    }

    .mode-panel.active {
      display: flex;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
    }

    button {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #111;
      background: transparent;
      color: #111;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
    }

    button:hover {
      background: #111;
      color: #fff;
    }

    #canvas-container {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: #fef9f3;
      overflow: hidden;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <aside id="controls">

    <div class="group">
      <label for="animationMode">Animation mode</label>
      <select id="animationMode">
        <option value="unfold">Cube unfold</option>
        <option value="triple">Triple cube reveal</option>
      </select>
    </div>

    <div id="unfoldControls" class="mode-panel active">

    <div class="group">
      <label>Top face PNG</label>
      <input id="topImage" type="file" accept="image/png,image/jpeg,image/webp" />
    </div>

    <div class="group">
      <label>Left face PNG</label>
      <input id="leftImage" type="file" accept="image/png,image/jpeg,image/webp" />
    </div>

    <div class="group">
      <label>Right face PNG</label>
      <input id="rightImage" type="file" accept="image/png,image/jpeg,image/webp" />
    </div>

    <div class="group">
      <label for="insideColor">Inside color</label>
      <input
        id="insideColor"
        type="color"
        value="#032932"
      />
    </div>

    <label class="checkbox">
      <input id="randomInnerColors" type="checkbox" />
      Random inner colors (palette)
    </label>

    <label class="checkbox">
      <input id="showGrid" type="checkbox" checked />
      Show isometric grid
    </label>

    </div>

    <div id="tripleControls" class="mode-panel">

      <p style="margin: 0; font-size: 11px; line-height: 1.5; opacity: 0.7;">
        Three stacked cubes separate, then rotate to reveal A, G, and M on the back of each cube.
      </p>

      <label class="checkbox">
        <input id="showGridTriple" type="checkbox" checked />
        Show isometric grid
      </label>

    </div>

    <div class="group">
      <div class="row">
        <label for="cubeSize">Cube size</label>
        <span id="cubeSizeValue" class="value"></span>
      </div>

      <input
        id="cubeSize"
        type="range"
        min="100"
        max="420"
        step="1"
        value="240"
      />
    </div>

    <div class="group">
      <div class="row">
        <label for="animationSpeed">Animation speed</label>
        <span id="animationSpeedValue" class="value"></span>
      </div>

      <input
        id="animationSpeed"
        type="range"
        min="0.15"
        max="2"
        step="0.05"
        value="0.7"
      />
    </div>

    <div class="group">
      <div class="row">
        <label for="foldedPause" id="foldedPauseLabel">Folded pause</label>
        <span id="foldedPauseValue" class="value"></span>
      </div>

      <input
        id="foldedPause"
        type="range"
        min="0"
        max="3"
        step="0.1"
        value="1"
      />
    </div>

    <div class="group">
      <div class="row">
        <label for="unfoldedPause" id="unfoldedPauseLabel">Unfolded pause</label>
        <span id="unfoldedPauseValue" class="value"></span>
      </div>

      <input
        id="unfoldedPause"
        type="range"
        min="0"
        max="3"
        step="0.1"
        value="0.8"
      />
    </div>

    <div class="group" id="revealedPauseGroup">
      <div class="row">
        <label for="revealedPause">Revealed pause</label>
        <span id="revealedPauseValue" class="value"></span>
      </div>

      <input
        id="revealedPause"
        type="range"
        min="0"
        max="3"
        step="0.1"
        value="1.2"
      />
    </div>

    <button id="restartButton">
      Restart animation
    </button>

  </aside>

  <main id="canvas-container"></main>

  <script src="triple-cube-mode.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
